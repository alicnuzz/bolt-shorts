name: Publish Shorts (06:30 & 17:00 Tashkent)
on:
  schedule:
    - cron: "20 23 * * *"     # 04:20 Toshkent -> 06:30 dagi video (GitHub ko'pincha ~1 soat kechikadi)
    - cron: "50 9 * * *"      # 14:50 Toshkent -> 17:00 dagi video
  workflow_dispatch:
    inputs:
      slot:
        description: "06:30 yoki 17:00"
        required: true
        default: "17:00"
concurrency: { group: publish, cancel-in-progress: false }
env:
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  START_DATE: ${{ vars.START_DATE }}
  SLOT: ${{ github.event.inputs.slot || (github.event.schedule == '20 23 * * *' && '06:30' || '17:00') }}
jobs:
  slot:
    runs-on: macos-latest          # Daniel ovozi (macOS 'say') shu yerda bor
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: brew install ffmpeg
      - run: pip install -r requirements.txt
      - name: Run slot
        run: python publish.py slot "$SLOT"

  retry:                           # Mac server topilmasa yoki xato bo'lsa: qayta urinish
    needs: slot
    if: ${{ always() && needs.slot.result != 'success' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env: { LATE_OK: "1" }
    steps:
      - name: Tell owner
        run: |
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" \
            --data-urlencode text="⏳ $SLOT dagi video birinchi urinishda chiqmadi (GitHub serveri band). Qayta urinyapman..." > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: brew install ffmpeg
      - run: pip install -r requirements.txt
      - name: Run slot (retry)
        run: python publish.py slot "$SLOT"

  alert:                           # ikkala urinish ham bo'lmasa: Telegram'ga xabar
    needs: [slot, retry]
    if: ${{ always() && needs.slot.result != 'success' && needs.retry.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" \
            --data-urlencode text="⚠️ Muammo: $SLOT dagi video ikki urinishda ham chiqmadi. Claude chatiga shu xabarni yuboring." > /dev/null
